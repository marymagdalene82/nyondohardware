{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4 mt-4">
  <h4>Deposit Customers</h4>
  <a href="{% url 'deposit_customer_create' %}" class="btn btn-warning">
    <i class="bi bi-plus-lg me-1"></i>New Customer
  </a>
</div>

<div class="card-custom mb-4">
  <div class="card-custom-body">
    <form method="get" class="row g-3 align-items-end">
      <div class="col-md-9">
        <label class="form-label">Search</label>
        <input type="text" name="q" class="form-control" value="{{ q }}" placeholder="Name, NIN or phone">
      </div>
      <div class="col-md-3">
        <button class="btn btn-warning w-100" type="submit">
          <i class="bi bi-search me-1"></i>Search
        </button>
      </div>
    </form>
  </div>
</div>

<div class="card-custom stock-table-card">
  <div class="card-custom-body stock-table-body">
    <div class="table-responsive">
      <table class="table table-custom stock-table">
        <thead class="stock-table-head">
          <tr>
            <th>Name</th>
            <th>NIN</th>
            <th>Phone</th>
            <th>Balance</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for c in customers %}
          <tr>
            <td class="fw-semibold">{{ c.full_name }}</td>
            <td>{{ c.nin }}</td>
            <td>{{ c.phone }}</td>
            <td>UGX {{ c.balance|floatformat:0 }}</td>
            <td class="text-end">
              <a class="btn btn-sm btn-outline-primary" href="{% url 'deposit_customer_detail' c.pk %}">
                <i class="bi bi-eye"></i>
              </a>
            </td>
          </tr>
          {% empty %}
          <tr><td colspan="5" class="text-center py-4">No deposit customers yet.</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
