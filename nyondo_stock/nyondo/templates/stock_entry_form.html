{% extends 'base.html' %}
{% block content %}
<div class="form-shell">
  <div class="form-hero">
    <div class="dashboard-toolbar mb-0">
      <div>
      <h1 style="font-size:large;">Add Inventory</h1>
      <p>Manage your inventory items</p></div>
      <a href="{% url 'stock_entry_list' %}" class="btn btn-warning">Go to Stock entry list</a>
    </div>
  </div>

  <div class="card-custom form-card">
    <div class="card-custom-body">
      <div class="section-title mb-4">Product Information</div>
      <form method="post" action="{% url 'add_stock' %}">
        {% csrf_token %}
        <div class="row g-4">
          <div class="col-md-4">
            <label class="form-label">Product</label>
            <select name="product" class="form-select">
              <option value="" selected disabled>Select Product</option>
              {% for p in products %}<option value="{{ p.id }}">{{ p.product_name }}</option>{% endfor %}
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Supplier</label>
            <select name="supplier" class="form-select">
              <option value="" selected disabled>Select Supplier</option>
              {% for s in suppliers %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Quantity Received</label>
            <input type="number" name="quantity" class="form-control" placeholder="Enter quantity" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Unit Cost (UGX)</label>
            <input type="number" name="unit_cost" class="form-control" placeholder="Enter unit cost" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Selling Price (UGX)</label>
            <input type="number" name="unit_price" class="form-control" placeholder="Enter selling price" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Payment Type</label>
            <select name="is_credit" class="form-select">
              <option selected disabled>Select payment type</option>
              <option value="False">Cash</option>
              <option value="True">Credit</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Amount Paid (UGX)</label>
            <input type="number" name="amount_paid" class="form-control" placeholder="Enter amount paid" />
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle me-1"></i>Save Entry</button>
          <a href="{% url 'stock_entry_list' %}" class="btn btn-outline-danger">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
