{% extends "base.html" %}
{% block content %}
<div class="form-shell">
  <div class="form-hero">
    <h1>{% if mode == "edit" %}Edit Supplier{% else %}New Supplier{% endif %}</h1>
    <p>Keep supplier contact information tidy and up to date.</p>
  </div>

  <div class="card-custom form-card">
    <div class="card-custom-body">
      <form method="post">
        {% csrf_token %}
        <div class="row g-4">
          <div class="col-md-6">
            <label class="form-label">Name</label>
            <input name="name" class="form-control" value="{{ supplier.name|default:'' }}" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Phone</label>
            <input name="phone" class="form-control" value="{{ supplier.phone|default:'' }}" required>
          </div>
          <div class="col-md-12">
            <label class="form-label">Contact Person</label>
            <input name="contact_person" class="form-control" value="{{ supplier.contact_person|default:'' }}">
          </div>
        </div>

        <div class="form-actions">
          <button class="btn btn-primary" type="submit">Save</button>
          <a class="btn btn-outline-secondary" href="{% url 'supplier_list' %}">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
