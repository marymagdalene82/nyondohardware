{% extends "base.html" %}
{% block content %}
<div class="container-fluid form-container mt-4">
  <div class="row justify-content-center">
    <div class="col form-area">
      <h5 class="mb-1">Pickup Goods (Deposit Scheme)</h5>
      <p class="text-muted mb-3">{{ customer.full_name }} • Balance: UGX {{ customer.balance|floatformat:0 }}</p>

      <form method="post">
        {% csrf_token %}
        <div class="row g-3 align-items-end">
          <div class="col-md-7">
            <label class="form-label">Product (eligible only)</label>
            <select name="product" class="form-select" required>
              <option value="">Select product</option>
              {% for p in products %}
              <option value="{{ p.id }}">{{ p.product_name }}{% if p.variant %} - {{ p.variant }}{% endif %} (Stock: {{ p.stock }})</option>
              {% endfor %}
            </select>
          </div>

          <div class="col-md-3">
            <label class="form-label">Quantity</label>
            <input type="number" name="quantity" class="form-control" min="1" step="1" required>
          </div>

          <div class="col-md-2">
            <button class="btn btn-warning w-100" type="submit">
              <i class="bi bi-check-circle"></i>
            </button>
          </div>
        </div>

        <div class="d-flex justify-content-center gap-3 mt-4">
          <a class="btn btn-outline-secondary" href="{% url 'deposit_customer_detail' customer.pk %}">Back</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
