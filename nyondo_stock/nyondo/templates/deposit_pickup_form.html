{% extends "base.html" %}
{% block content %}
<div class="form-shell">
  <div class="form-hero">
    <h1>Pickup Goods</h1>
    <p>{{ customer.full_name }} · Balance: UGX {{ customer.balance|floatformat:0 }}</p>
  </div>

  <div class="card-custom form-card">
    <div class="card-custom-body">
      <form method="post">
        {% csrf_token %}
        <div class="row g-4 align-items-end">
          <div class="col-md-7">
            <label class="form-label">Product (eligible only)</label>
            <select name="product" class="form-select" required>
              <option value="">Select product</option>
              {% for p in products %}
              <option value="{{ p.id }}">{{ p.product_name }}{% if p.variant %} - {{ p.variant }}{% endif %} (Stock: {{ p.stock }})</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Quantity</label>
            <input type="number" name="quantity" class="form-control" min="1" step="1" required>
          </div>
          <div class="col-md-2">
            <button class="btn btn-warning w-100" type="submit"><i class="bi bi-check-circle"></i></button>
          </div>
        </div>

        <div class="form-actions">
          <a class="btn btn-outline-secondary" href="{% url 'deposit_customer_detail' customer.pk %}">Back</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
