{% extends 'base.html' %} {% block content %}
<div class="container-fluid form-container">
    <div class="row justify-content-center stock-register-layout">
        <div class="col form-area">
            <!-- Form Area -->

            <form action="{% url 'add_product' %}" method="post">
                {% csrf_token %}
                <div class="form-heading">
                    <h5>Add New Product</h5>
                </div>
                <div class="row my-4">
                    <div class="col">
                        <label for="product_name" class="form-label">Product Name</label>
                        <input type="text" name="product_name" class="form-control" />
                    </div>

                    <div class="col">
                        <label for="category" class="form-label">Category</label>
                        <select class="form-select" name="category">
                            <option disabled selected>Select category</option>
                            <option value="cement">Cement</option>
                            <option value="iron_bars">Iron bars</option>
                            <option value="nails">Nails</option>
                            <option value="iron_sheets">Iron sheets</option>
                            <option value="wheelbarrows">Wheelbarrows</option>
                        </select>
                    </div>

                    <div class="col">
                        <label for="variant" class="form-label">Variant</label>
                        <input type="text" name="variant" placeholder="e.g. CEM II N, 12mm, 3-inch nails"
                            class="form-control" />
                    </div>
                    <div class="col">
                        <label for="unit" class="form-label">Unit</label>
                        <select name="unit" required>
                            <option value="">Select unit</option>
                            <option value="bag">Bag</option>
                            <option value="piece">Piece</option>
                            <option value="kg">Kilogram</option>
                            <option value="sheet">Sheet</option>
                        </select>
                    </div>
                </div>

                <div class="row my-4 g-3">
                    <div class="col">
                        <label for="unit_cost" class="form-label">Unit Cost(UGX)</label>
                        <input type="number" name="unit_cost" class="form-control" />
                    </div>
                    <div class="col">
                        <label for="unit_price" class="form-label">Unit Price(UGX)</label>
                        <input type="number" name="unit_price" class="form-control" />
                    </div>

                    <div class="col">
                        <label for="reorder_level" class="form-label">Reorder level</label>
                        <input type="number" name="reorder_level" class="form-control" />
                    </div>
                </div>

                <div class="row g-2">
                    <div class="d-flex justify-content-center gap-3">
                        <button type="submit" class="btn btn-primary">Save Stock</button>
                        <a href="" class="btn btn-outline-danger">Cancel</a>
                    </div>
                    <div class="col"></div>
                </div>
            </form>
        </div>
    </div>

    <!-- Stock list goes here -->
    
</div>

{% endblock %}
