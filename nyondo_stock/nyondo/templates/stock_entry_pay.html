{% extends "base.html" %}
{% block content %}
<div class="form-shell">
  <div class="form-hero">
    <h1>Pay Supplier Balance</h1>
    <p>{{ entry.product.product_name }} · {{ entry.supplier.name }} · Balance: UGX {{ entry.balance_due|floatformat:0 }}</p>
  </div>

  <div class="card-custom form-card">
    <div class="card-custom-body">
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Amount to pay (UGX)</label>
          <input class="form-control" type="number" name="pay_amount" min="0" step="0.01" required>
        </div>

        <div class="form-actions">
          <button class="btn btn-warning" type="submit"><i class="bi bi-cash me-1"></i>Record Payment</button>
          <a class="btn btn-outline-secondary" href="{% url 'stock_entry_list' %}">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
