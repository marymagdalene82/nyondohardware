{% extends "base.html" %}
{% block content %}
<div class="container-fluid form-container mt-4">
  <div class="row justify-content-center">
    <div class="col form-area">
      <h5 class="mb-1">Pay Supplier Balance</h5>
      <p class="text-muted mb-3">
        {{ entry.product.product_name }} • {{ entry.supplier.name }} • Balance: UGX {{ entry.balance_due|floatformat:0 }}
      </p>

      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Amount to pay (UGX)</label>
          <input class="form-control" type="number" name="pay_amount" min="0" step="0.01" required>
        </div>

        <div class="d-flex gap-2">
          <button class="btn btn-warning" type="submit">
            <i class="bi bi-cash"></i> Record Payment
          </button>
          <a class="btn btn-outline-secondary" href="{% url 'stock_entry_list' %}">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
