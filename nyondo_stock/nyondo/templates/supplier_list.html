{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4 mt-4">
  <h4>Suppliers</h4>
  <a href="{% url 'supplier_create' %}" class="btn btn-warning">
    <i class="bi bi-plus-lg me-1"></i>New Supplier
  </a>
</div>

<div class="card-custom mb-4">
  <div class="card-custom-body">
    <form method="get" class="row g-3 align-items-end">
      <div class="col-md-9">
        <!-- <label class="form-label">Search</label> -->
        <input name="q" class="form-control" value="{{ q }}" placeholder="Name, phone, contact person">
      </div>
      <div class="col-md-3">
        <button class="btn btn-warning w-100" type="submit">
          <i class="bi bi-search me-1"></i>Search
        </button>
      </div>
    </form>
  </div>
</div>

<div class="card-custom stock-table-card">
  <div class="card-custom-body stock-table-body">
    <div class="table-responsive">
      <table class="table table-custom stock-table">
        <thead class="stock-table-head">
          <tr>
            <th>Name</th>
            <th>Phone</th>
            <th>Contact Person</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for s in suppliers %}
          <tr>
            <td class="fw-semibold">{{ s.name }}</td>
            <td>{{ s.phone }}</td>
            <td>{{ s.contact_person|default:"-" }}</td>
            <td class="text-end">
              <a class="btn btn-sm btn-outline-primary" href="{% url 'supplier_detail' s.pk %}">
                <i class="bi bi-eye"></i>
              </a>
              <a class="btn btn-sm btn-outline-secondary" href="{% url 'supplier_edit' s.pk %}">
                <i class="bi bi-pencil"></i>
              </a>
            </td>
          </tr>
          {% empty %}
          <tr><td colspan="4" class="text-center py-4">No suppliers yet.</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
