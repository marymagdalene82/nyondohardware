{% extends "base.html" %}
{% block content %}
<div class="container-fluid form-container mt-4">
  <div class="row justify-content-center">
    <div class="col form-area">
      <h5 class="mb-3">Register Deposit Customer</h5>

      <form method="post">
        {% csrf_token %}
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Full Name (as on NIN)</label>
            <input name="full_name" class="form-control" required>
          </div>

          <div class="col-md-6">
            <label class="form-label">NIN</label>
            <input name="nin" class="form-control" required>
          </div>

          <div class="col-md-6">
            <label class="form-label">Phone</label>
            <input name="phone" class="form-control" placeholder="07XXXXXXXX" required>
          </div>

          <div class="col-md-6">
            <label class="form-label">Occupation</label>
            <input name="occupation" class="form-control">
          </div>

          <div class="col-md-12">
            <label class="form-label">Address</label>
            <input name="address" class="form-control">
          </div>
        </div>

        <div class="d-flex justify-content-center gap-3 mt-4">
          <button class="btn btn-primary" type="submit">Save</button>
          <a class="btn btn-outline-danger" href="{% url 'deposit_customer_list' %}">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
