{% extends "base.html" %}
{% block content %}
<div class="form-shell">
  <div class="form-hero">
    <h1>Register Deposit Customer</h1>
    <p>Add a customer to the deposit scheme and keep their details ready for pickup and top-up actions.</p>
  </div>

  <div class="card-custom form-card">
    <div class="card-custom-body">
      <form method="post">
        {% csrf_token %}
        <div class="row g-4">
          <div class="col-md-6">
            <label class="form-label">Full Name (as on NIN)</label>
            <input name="full_name" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">NIN</label>
            <input name="nin" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Phone</label>
            <input name="phone" class="form-control" placeholder="07XXXXXXXX" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Occupation</label>
            <input name="occupation" class="form-control">
          </div>
          <div class="col-md-12">
            <label class="form-label">Address</label>
            <input name="address" class="form-control">
          </div>
        </div>

        <div class="form-actions">
          <button class="btn btn-primary" type="submit">Save</button>
          <a class="btn btn-outline-danger" href="{% url 'deposit_customer_list' %}">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
