{% extends "base.html" %}
{% block content %}
<div class="form-shell">
  <div class="form-hero">
    <h1>Record Deposit</h1>
    <p>{{ customer.full_name }} · Balance: UGX {{ customer.balance|floatformat:0 }}</p>
  </div>

  <div class="card-custom form-card">
    <div class="card-custom-body">
      <form method="post">
        {% csrf_token %}
        <div class="row g-4">
          <div class="col-md-6">
            <label class="form-label">Amount (UGX)</label>
            <input type="number" name="amount" step="0.01" min="0" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Notes (optional)</label>
            <input name="notes" class="form-control" placeholder="e.g. May salary deposit">
          </div>
        </div>

        <div class="form-actions">
          <button class="btn btn-warning" type="submit"><i class="bi bi-check-circle me-1"></i>Save</button>
          <a class="btn btn-outline-secondary" href="{% url 'deposit_customer_detail' customer.pk %}">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
